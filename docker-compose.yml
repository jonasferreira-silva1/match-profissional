services:
  # Aplicação Next.js (Frontend + Backend)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resumematch-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://resumematch:resumematch123@postgres:5432/resumematch
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - resumematch-network

  # Banco de dados PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: resumematch-db
    environment:
      - POSTGRES_USER=resumematch
      - POSTGRES_PASSWORD=resumematch123
      - POSTGRES_DB=resumematch
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/create-tables.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resumematch"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - resumematch-network

volumes:
  postgres-data:

networks:
  resumematch-network:
    driver: bridge

